name: Publish VPM listing

on:
  push:
    branches: [main]
    paths:
      - vpm.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate VPM listing JSON
        shell: pwsh
        run: |
          $listing = Get-Content -Raw vpm.json | ConvertFrom-Json
          if (@($listing.packages.PSObject.Properties).Count -eq 0) {
            throw 'vpm.json must contain at least one package.'
          }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
