name: Validate VPM repository

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate package and listing
        shell: pwsh
        run: |
          $listing = Get-Content -Raw vpm.json | ConvertFrom-Json
          Get-ChildItem packages -Directory | ForEach-Object {
            $packagePath = $_.FullName
            $manifest = Get-Content -Raw "$packagePath/package.json" | ConvertFrom-Json
            $listed = $listing.packages.($manifest.name).versions.($manifest.version)
            if ($null -eq $listed) {
              throw "vpm.json does not contain $($manifest.name) $($manifest.version)."
            }
            if ($listed.name -ne $manifest.name -or $listed.version -ne $manifest.version) {
              throw "Package manifest and vpm.json disagree for $($manifest.name)."
            }
            foreach ($dependency in $manifest.vpmDependencies.PSObject.Properties.Name) {
              if ($manifest.vpmDependencies.$dependency -ne $listed.vpmDependencies.$dependency) {
                throw "Dependency mismatch for $($manifest.name): $dependency"
              }
            }
            $assetFiles = Get-ChildItem -Recurse $packagePath -File |
              Where-Object { $_.Extension -in '.cs', '.asmdef' }
            foreach ($asset in $assetFiles) {
              if (-not (Test-Path "$($asset.FullName).meta")) {
                throw "Missing Unity meta file: $($asset.FullName)"
              }
            }
          }
          $guids = Get-ChildItem -Recurse packages -Filter '*.meta' |
            ForEach-Object { Select-String -LiteralPath $_.FullName -Pattern '^guid: ([0-9a-f]{32})$' } |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if (($guids | Sort-Object -Unique).Count -ne $guids.Count) {
            throw 'Duplicate Unity GUID detected.'
          }
